<!DOCTYPE html><html><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><link rel=stylesheet href=popup.css><script type=module src=popup.js></script></head><body><header><img src=images/icon-96.png alt=""><div><div class=title>Open in RyukGram</div><div class=subtitle>instagram.com links in the app</div></div></header><label class=row><span><b>Show Open banner</b><small>A bar on Instagram pages with an Open button</small></span> <input type=checkbox id=banner></label><div class=row><span><b>Banner position</b></span><div class=seg id=position><button data-value=top>Top</button> <button data-value=bottom>Bottom</button></div></div><label class=row><span><b>Every Instagram page</b><small>Home, login, settings, explore and redirect links open in the app too</small></span> <input type=checkbox id=allPages></label> <label class=row><span><b>Redirect Instagram's Open app</b><small>Instagram's own button opens RyukGram instead of hiding</small></span> <input type=checkbox id=hijack></label> <label class=row><span><b>Block App Store jumps</b><small>Links that send you to the App Store open in RyukGram instead</small></span> <input type=checkbox id=blockStore></label> <label class=row><span><b>Open automatically</b><small>Jump to the app as soon as a link loads</small></span> <input type=checkbox id=autoOpen></label></body></html>
